name: Build and publish docker image

on:
  workflow_dispatch:
    inputs:
      alpine_image_version:
        description: Alpine base image version
        required: false
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io
  ALPINE_IMAGE_VERSION: ${{ github.event.inputs.alpine_image_version || vars.ALPINE_IMAGE_VERSION || '3.19' }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve Alpine base image
        id: alpine-base
        shell: bash
        run: |
          image="alpine:${ALPINE_IMAGE_VERSION}"
          digest="$(docker buildx imagetools inspect "${image}" --format '{{.Manifest.Digest}}')"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log into Docker Hub
        id: docker-hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ vars.DOCKERHUB_IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=alpine-${{ env.ALPINE_IMAGE_VERSION }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            ALPINE_IMAGE_VERSION=${{ env.ALPINE_IMAGE_VERSION }}
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=Alpine image with extended cron

      - name: Delete all untagged packages
        if: github.event_name != 'pull_request'
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: 'container'
          min-versions-to-keep: 0
          delete-only-untagged-versions: 'true'

      - name: Generate build summary
        run: |
          ALPINE_IMAGE=${{ steps.alpine-base.outputs.image }}
          ALPINE_IMAGE_DIGEST=${{ steps.alpine-base.outputs.digest }}
          echo "## Build variables:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Alpine image: ${ALPINE_IMAGE}" >> $GITHUB_STEP_SUMMARY
          echo "- Alpine image digest: ${ALPINE_IMAGE_DIGEST}" >> $GITHUB_STEP_SUMMARY
